spring.application.name=analyzer
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Snapshot Consumer
kafka.consumer.snapshot.group-id=analyzer-snapshot
kafka.topics.snapshots=telemetry.snapshots.v1

# Hub Event Consumer
kafka.consumer.hub.group-id=analyzer-hub
kafka.topics.hubs=telemetry.hubs.v1

# gRPC Client Hub Router
grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

# Logging
logging.level.ru.yandex.practicum.analyzer=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.apache.kafka=WARN
